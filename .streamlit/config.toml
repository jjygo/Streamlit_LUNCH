# 앱처럼 깔끔하게: 크림 바탕 + 테라코타 강조색 하나 + Pretendard (라이트/다크는 폰 설정을 따라감)

[client]
toolbarMode = "minimal"       # 오른쪽 위 Deploy·개발 메뉴 숨김 (QR로 들어온 폰에서도 깔끔하게)
showErrorDetails = "type"     # 에러가 나면 화면엔 종류만 (서버 경로·코드 줄은 터미널·로그에만). 화면에서 다 보려면 이 줄을 지우기

[theme]
font = "Pretendard:https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css"
baseFontSize = 17             # 본문 17px (입력칸은 기본 0.875배라 15px → app.py CSS에서 1rem으로 키워 아이폰 확대 방지)
headingFontSizes = ["1.875rem", "1.375rem", "1.125rem"]
headingFontWeights = [800, 700, 700]
metricValueFontSize = "1.875rem"   # 숫자는 크고 굵게
metricValueFontWeight = 800
baseRadius = "0.75rem"
buttonRadius = "0.875rem"
paddingTop = "1rem"
paddingBottom = "3rem"
showWidgetBorder = true      # 입력칸 테두리가 보이게 (회색 면만으로는 칸이 안 보임)

# 라이트: 본문색을 거의 검정으로 (60% 흐린 캡션 글자도 4.5:1 이상), 테두리 3:1
#   배지·알림 색(빨강 휴무 / 초록 영업 중 / 회색 영업 전·끝)도 크림에 어울리게 따뜻한 톤
#   blue는 이름만 파랑, 값은 황토색 (실시간 배지·오늘 N표 배지·완료 체크·안내 상자 st.info)
[theme.light]
primaryColor = "#9C4026"
backgroundColor = "#FAF6EF"
secondaryBackgroundColor = "#F3ECE1"
textColor = "#16120F"
borderColor = "#948576"       # 입력칸·라디오 테두리 3:1
linkColor = "#9C4026"
codeBackgroundColor = "#F3ECE1"
blueBackgroundColor = "#F2E4C9"
blueTextColor = "#6E4A0E"
greenBackgroundColor = "#E0EEDF"
greenTextColor = "#25643A"
redBackgroundColor = "#F8E1DC"
redTextColor = "#A1281C"
grayBackgroundColor = "#ECE5DA"
grayTextColor = "#5A5047"

# 다크: 주 버튼 흰 글자 4.5:1 때문에 강조색을 너무 밝게 못 함 → 링크·배지 글자만 밝게, 고른 칩 글자는 app.py에서 본문색으로
[theme.dark]
primaryColor = "#C2502F"
backgroundColor = "#1D1A17"
secondaryBackgroundColor = "#2A2622"
textColor = "#F2ECE3"
borderColor = "#7A7064"
linkColor = "#E2805E"
codeBackgroundColor = "#2A2622"
blueBackgroundColor = "#3A2E1A"
blueTextColor = "#EBC88A"
greenBackgroundColor = "#1E3324"
greenTextColor = "#9FD8AE"
redBackgroundColor = "#45201B"
redTextColor = "#FFB4A8"
grayBackgroundColor = "#36302B"
grayTextColor = "#D3CAC0"
